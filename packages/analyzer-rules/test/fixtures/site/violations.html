<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font: 16px/24px sans-serif;
      }
      main {
        width: 600px;
        padding: 20px;
      }
      #low {
        width: 400px;
        height: 24px;
        margin: 0 0 16px;
        color: #c9c9c9;
        background: #f7f5ff;
      }
      #logo {
        display: block;
        width: 100px;
        height: 40px;
        margin-bottom: 16px;
      }
      #icon {
        display: block;
        width: 44px;
        height: 44px;
        margin-bottom: 16px;
      }
      #email {
        display: block;
        width: 300px;
        height: 32px;
        margin-bottom: 16px;
      }
      #plain {
        width: 200px;
        height: 30px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <!-- One page with the usual violations: low contrast, no alt text, a button and a field with no name, no title and no lang. -->
    <main>
      <p id="low">Low contrast text here</p>
      <img id="logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
      <button id="icon"></button>
      <input id="email" type="text" />
      <div id="plain" role="img"></div>
    </main>
  </body>
</html>
