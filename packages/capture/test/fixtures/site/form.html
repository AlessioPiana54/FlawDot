<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 600px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <form action="/submit" method="post">
      <input
        id="q"
        class="abs"
        name="q"
        value=""
        style="left: 40px; top: 40px; width: 300px; height: 32px"
      />
      <button
        id="go"
        class="abs"
        type="submit"
        style="left: 40px; top: 100px; width: 120px; height: 40px"
      >
        Send
      </button>
    </form>
  </body>
</html>
