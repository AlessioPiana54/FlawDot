<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tall</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 9000px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        width: 390px;
      }
    </style>
  </head>
  <body>
    <button id="t0" class="abs" style="left: 10px; top: 100px; width: 100px; height: 30px">
      t0
    </button>
    <button id="t1" class="abs" style="left: 10px; top: 1400px; width: 100px; height: 48px">
      t1
    </button>
    <button id="strad" class="abs" style="left: 200px; top: 1480px; width: 100px; height: 100px">
      strad
    </button>
    <button id="t2" class="abs" style="left: 10px; top: 2600px; width: 100px; height: 30px">
      t2
    </button>
    <button id="t3" class="abs" style="left: 10px; top: 3900px; width: 100px; height: 30px">
      t3
    </button>
    <button id="strad2" class="abs" style="left: 10px; top: 8100px; width: 100px; height: 200px">
      strad2
    </button>
    <button id="t4" class="abs" style="left: 10px; top: 8500px; width: 100px; height: 30px">
      t4
    </button>
  </body>
</html>
