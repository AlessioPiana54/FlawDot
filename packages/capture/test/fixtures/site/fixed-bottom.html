<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixed bottom</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 2400px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <button
      id="cta"
      class="abs"
      style="left: 40px; top: 200px; width: 180px; height: 48px; background: #0a0; border: 0"
    >
      Buy
    </button>
    <button
      id="vh"
      class="abs"
      style="left: 400px; top: 100px; width: 100px; height: 100vh; background: #00f; border: 0"
    >
      Tall
    </button>
    <button
      id="bar"
      style="
        position: fixed;
        bottom: 0;
        left: 0;
        width: 300px;
        height: 60px;
        margin: 0;
        padding: 0;
        background: #f00;
        border: 0;
      "
    >
      Bar
    </button>
  </body>
</html>
