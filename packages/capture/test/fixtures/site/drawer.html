<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drawer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 400px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <button id="visible" class="abs" style="left: 10px; top: 10px; width: 100px; height: 30px">
      visible
    </button>
    <div class="abs" style="left: 0; top: 0; width: 1440px; height: 400px">
      <button id="drawer" class="abs" style="left: 1500px; top: 60px; width: 100px; height: 30px">
        drawer
      </button>
    </div>
  </body>
</html>
