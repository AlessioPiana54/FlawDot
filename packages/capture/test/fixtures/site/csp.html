<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSP</title>
    <meta http-equiv="Content-Security-Policy" content="style-src 'none'" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 1200px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <button id="cta" class="abs" style="left: 40px; top: 200px; width: 180px; height: 48px">
      Buy now
    </button>
    <div
      id="onetrust-banner-sdk"
      style="position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; background: #222"
    >
      <button id="accept" style="margin: 20px">Accept all</button>
    </div>
  </body>
</html>
