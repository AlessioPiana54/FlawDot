<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App</title>
  </head>
  <body>
    <!-- A single-page app: after the page has loaded, its router moves to another route that is not a login. -->
    <h1>App</h1>
    <button id="go">Go</button>
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => history.replaceState(null, "", "/dashboard"), 200);
      });
    </script>
  </body>
</html>
