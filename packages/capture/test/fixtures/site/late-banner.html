<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Late banner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 3000px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <button id="cta" class="abs" style="left: 40px; top: 300px; width: 180px; height: 48px">
      Buy now
    </button>
    <script>
      window.addEventListener("scroll", () => {
        if (document.getElementById("late")) return;
        const box = document.createElement("div");
        box.id = "late";
        box.style.cssText =
          "position: fixed; bottom: 0; left: 0; width: 100%; height: 100px; background: #222";
        box.innerHTML =
          '<p style="color: #fff; margin: 0">We use cookies to give you the best experience.</p><button id="late-accept">Accept all</button>';
        document.body.appendChild(box);
      });
    </script>
  </body>
</html>
