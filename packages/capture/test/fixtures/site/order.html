<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Order</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1440px;
        height: 400px;
        font: 16px/24px sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <button id="a" class="abs" style="left: 300px; top: 102px; width: 40px; height: 30px">A</button>
    <button id="b" class="abs" style="left: 20px; top: 107px; width: 40px; height: 30px">B</button>
    <button id="c" class="abs" style="left: 20px; top: 140px; width: 40px; height: 30px">C</button>
  </body>
</html>
